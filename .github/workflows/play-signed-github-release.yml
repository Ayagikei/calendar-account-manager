name: Play-signed GitHub Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Play versionCode (empty = latest production)"
        required: false
        default: ""
        type: string
      version_name:
        description: "Release tag/name without v prefix (empty = from Gradle)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      version_code:
        required: false
        default: ""
        type: string
      version_name:
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: play-signed-github-release
  cancel-in-progress: false

jobs:
  publish:
    name: Download Play APK and publish GitHub Release
    runs-on: ubuntu-latest
    env:
      GPC_APP: fun.lifeupapp.calmanager
      GPC_NO_INTERACTIVE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for GPC CLI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GPC CLI
        run: npm install --global --no-fund --no-audit @gpc-cli/cli@0.9.95

      - name: Prepare Google Play credentials
        shell: bash
        env:
          GPC_SERVICE_ACCOUNT_JSON: ${{ secrets.GPC_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "$GPC_SERVICE_ACCOUNT_JSON" ]]; then
            echo "错误: GPC_SERVICE_ACCOUNT_JSON 未配置。"
            exit 1
          fi
          printf '%s' "$GPC_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account"' >/dev/null
          service_account_path="$RUNNER_TEMP/gpc-service-account.json"
          printf '%s' "$GPC_SERVICE_ACCOUNT_JSON" > "$service_account_path"
          chmod 600 "$service_account_path"
          echo "GPC_SERVICE_ACCOUNT=$service_account_path" >> "$GITHUB_ENV"

      - name: Resolve version metadata
        id: version
        shell: bash
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          version_code="$INPUT_VERSION_CODE"
          if [[ -z "$version_code" ]]; then
            version_code="$(gpc --app "$GPC_APP" --output json releases status | jq -r '
              (map(select(.track == "production" and (.versionCodes | length) > 0)) | .[0].versionCodes[0])
              // (map(.versionCodes[]?) | map(tonumber) | max | tostring)
            ')"
          fi
          [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || {
            echo "错误: versionCode 无法识别: $version_code"
            exit 1
          }

          version_name="$INPUT_VERSION_NAME"
          if [[ -z "$version_name" ]]; then
            version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)"
          fi
          [[ "$version_name" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "错误: versionName 无法识别: $version_name"
            exit 1
          }

          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
          } >> "$GITHUB_OUTPUT"

      - name: Download Play-signed universal APK
        id: apk
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x scripts/download-play-universal-apk.sh
          output="$RUNNER_TEMP/calendar-account-manager-${VERSION_NAME}-${VERSION_CODE}-play-signed-universal.apk"
          scripts/download-play-universal-apk.sh "$VERSION_CODE" "$output"
          echo "apk=$output" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          tag="v${VERSION_NAME}"
          notes="$(cat <<EOF
          Play-signed universal APK for sideload.

          Prefer [Google Play](https://play.google.com/store/apps/details?id=fun.lifeupapp.calmanager) when you can use it. This APK is generated by Play App Signing for the same ${VERSION_NAME} (${VERSION_CODE}) build.
          EOF
          )"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$APK" --clobber
            gh release edit "$tag" --notes "$notes" --latest
          else
            gh release create "$tag" "$APK" \
              --title "Calendar Account Manager ${VERSION_NAME}" \
              --notes "$notes" \
              --latest
          fi

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/gpc-service-account.json"
